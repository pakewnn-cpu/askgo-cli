name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sanity check
        run: python -m compileall -q askgo tests

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
