name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q askgo

      - name: Import check
        run: python -c "import askgo, askgo.cli, askgo.client, askgo.config, askgo.errors, askgo.ipc, askgo.media, askgo.selectors, askgo.session"
